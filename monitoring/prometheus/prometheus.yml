global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: todoapp-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          app: todoapp

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]